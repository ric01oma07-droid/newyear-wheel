<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новогоднее Колесо Удачи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем библиотеку для праздничного салюта/конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- Шапка -->
    <header class="w-full max-w-md flex justify-between items-center py-2">
        <h1 class="text-xl font-bold tracking-wider text-amber-400">🎄 КОЛЕСО УДАЧИ</h1>
        <button id="adminBtn" class="hidden bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-amber-500/30 text-amber-300 transition">
            ⚙️ Админка
        </button>
    </header>

    <!-- Основной контент (Колесо) -->
    <main class="flex flex-col items-center justify-center my-auto">
        <div class="wheel-container my-6">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>

        <!-- Поле промокода -->
        <div id="promoSection" class="w-full max-w-xs mb-4">
            <input type="text" id="promoInput" placeholder="Введите промокод (необязательно)" 
                   class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-center text-sm uppercase tracking-widest placeholder:normal-case placeholder:tracking-normal focus:outline-none focus:border-amber-400 transition">
        </div>

        <!-- Кнопка вращения -->
        <button id="spinBtn" class="w-full max-w-xs bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-amber-500/20 active:scale-95 transition duration-200">
            КРУТИТЬ КОЛЕСО 🎁
        </button>
    </main>

    <!-- Модальное окно выигрыша -->
    <div id="winModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="text-5xl mb-3" id="winIcon">🎉</div>
            <h2 class="text-xl font-bold mb-1 text-amber-400">Поздравляем!</h2>
            <p class="text-slate-300 text-sm mb-6">Вы выиграли: <span id="winPrizeText" class="font-bold text-white"></span></p>
            <button id="claimBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
                Забрать приз в Telegram 🚀
            </button>
        </div>
    </div>

    <!-- Админ-панель (Выдвижная панель / Дровер) -->
    <div id="settingsDrawer" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex-col z-50 p-4 overflow-y-auto">
        <div class="max-w-md w-full mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-5 my-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h2 class="font-bold text-lg text-amber-400">⚙️ Управление колесом</h2>
                <button id="closeAdminBtn" class="text-slate-400 hover:text-white text-xl px-2">✕</button>
            </div>

            <!-- Статистика и призы -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Настройка призов, шансов и статистика побед:</label>
                <div id="prizesEditorList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    <!-- Заполняется динамически -->
                </div>
            </div>

            <!-- Промокоды -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Активные промокоды (через запятую):</label>
                <input type="text" id="promosEditorInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <button id="applySettingsBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition">
                Сохранить и применить для всех 💾
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ ЗАМЕНИТЕ НА ВШУ АМВЕРА ССЫЛКУ ЕСЛИ ОТЛИЧАЕТСЯ
        const API_URL = "https://year-wheel-bot-ric01.msk1.amvera.tech/api/settings";
        const ADMIN_ID = 7008640180;

        let state = {
            currentTheme: "newyear",
            validPromos: ["NEWYEAR2027", "SNOW2027", "XMAS", "GIFT", "SANTA"],
            prizes: [
                { label: "Скидка 15%", icon: "🎄", chance: 30, wins: 0 },
                { label: "Чашка какао", icon: "☕", "chance": 25, wins: 0 },
                { label: "Подарок-сюрприз", icon: "🎁", "chance": 15, wins: 0 },
                { label: "Кэшбэк 500₽", icon: "✨", "chance": 10, "wins": 0 },
                { label: "Скидка 25%", icon: "⭐", "chance": 10, "wins": 0 },
                { label: "+300 бонусов", icon: "❄️", "chance": 6, "wins": 0 },
                { label: "Билет на елку", icon: "🎟️", "chance": 3, "wins": 0 },
                { label: "СУПЕРПРИЗ", icon: "🎅", "chance": 1, "wins": 0 }
            ]
        };

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const winModal = document.getElementById('winModal');
        const winPrizeText = document.getElementById('winPrizeText');
        const winIcon = document.getElementById('winIcon');
        const claimBtn = document.getElementById('claimBtn');
        const adminBtn = document.getElementById('adminBtn');
        const settingsDrawer = document.getElementById('settingsDrawer');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const applySettingsBtn = document.getElementById('applySettingsBtn');
        const prizesEditorList = document.getElementById('prizesEditorList');
        const promosEditorInput = document.getElementById('promosEditorInput');
        const promoInput = document.getElementById('promoInput');

        let currentAngle = 0;
        let isSpinning = false;
        let selectedPrizeResult = null;

        // Показываем кнопку админа если совпадает ID
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id === ADMIN_ID) {
            adminBtn.classList.remove('hidden');
        }

        // Загрузка настроек с сервера
        async function loadSettingsFromServer() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data.prizes) state.prizes = data.prizes;
                    if (data.validPromos) state.validPromos = data.validPromos;
                    if (data.currentTheme) state.currentTheme = data.currentTheme;
                }
            } catch (e) {
                console.log("Используются локальные настройки (ошибка сети)");
            }
            drawWheel();
        }

        // Отрисовка колеса
        function drawWheel() {
            const prizes = state.prizes;
            const totalSlices = prizes.length;
            const arcSize = (2 * Math.PI) / totalSlices;
            const colors = ['#1e293b', '#334155', '#1e293b', '#334155', '#1e293b', '#334155', '#1e293b', '#334155'];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            prizes.forEach((prize, i) => {
                const angle = i * arcSize + currentAngle;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 300, angle, angle + arcSize);
                ctx.lineTo(300, 300);
                ctx.fill();
                ctx.save();

                // Текст и иконка на секторе
                ctx.translate(300, 300);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(`${prize.icon} ${prize.label}`, 270, 10);
                ctx.restore();
            });
        }

        // Выбор приза по шансам
        function getWeightedPrize() {
            const totalChance = state.prizes.reduce((sum, p) => sum + p.chance, 0);
            let randomNum = Math.random() * totalChance;
            
            for (let i = 0; i < state.prizes.length; i++) {
                if (randomNum < state.prizes[i].chance) {
                    return { prize: state.prizes[i], index: i };
                }
                randomNum -= state.prizes[i].chance;
            }
            return { prize: state.prizes[0], index: 0 };
        }

        // Вращение колеса
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');

            const { prize, index } = getWeightedPrize();
            selectedPrizeResult = prize;

            const totalSlices = state.prizes.length;
            const arcSize = (2 * Math.PI) / totalSlices;
            
            // Рассчитываем угол остановки
            const targetAngle = 1.5 * Math.PI - (index * arcSize + arcSize / 2);
            const spins = 5; // количество оборотов
            const totalRotation = spins * 2 * Math.PI + targetAngle - (currentAngle % (2 * Math.PI));

            const startAngle = currentAngle;
            const startTime = performance.now();
            const duration = 4000; // 4 секунды

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Плавное замедление (easeOut)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + totalRotation * easeOut;
                
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50');

                    // Запуск салюта конфетти при победе
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });

                    // Показываем окно выигрыша
                    winIcon.textContent = prize.icon;
                    winPrizeText.textContent = prize.label;
                    winModal.classList.remove('hidden');
                    winModal.classList.add('flex');
                }
            }

            requestAnimationFrame(animate);
        });

        // Отправка данных боту
        claimBtn.addEventListener('click', () => {
            if (!selectedPrizeResult) return;
            const promo = promoInput.value.trim().toUpperCase();

            const dataToSend = {
                action: "prize_claimed",
                prize: selectedPrizeResult.label,
                promo: promo || null
            };

            tg.sendData(JSON.stringify(dataToSend));
            tg.close();
        });

        // Открытие админки
        adminBtn.addEventListener('click', () => {
            prizesEditorList.innerHTML = '';
            state.prizes.forEach((p, idx) => {
                prizesEditorList.innerHTML += `
                    <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/60 flex flex-col gap-2">
                        <div class="flex items-center gap-2">
                            <input type="text" value="${p.icon}" data-idx="${idx}" data-field="icon" class="w-12 bg-slate-900 border border-slate-700 rounded-lg text-center py-1 text-sm">
                            <input type="text" value="${p.label}" data-idx="${idx}" data-field="label" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-sm">
                        </div>
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span>Шанс (%): <input type="number" value="${p.chance}" data-idx="${idx}" data-field="chance" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white text-center"></span>
                            <span class="bg-slate-900 px-2 py-1 rounded-lg text-amber-300 font-medium">Выигрышей: ${p.wins || 0}</span>
                        </div>
                    </div>
                `;
            });
            promosEditorInput.value = state.validPromos.join(', ');
            settingsDrawer.classList.remove('hidden');
            settingsDrawer.classList.add('flex');
        });

        closeAdminBtn.addEventListener('click', () => {
            settingsDrawer.classList.add('hidden');
            settingsDrawer.classList.remove('flex');
        });

        // Сохранение настроек из админки
        applySettingsBtn.addEventListener('click', async () => {
            const chanceInputs = prizesEditorList.querySelectorAll('input[data-field="chance"]');
            chanceInputs.forEach(inp => {
                const idx = parseInt(inp.dataset.idx, 10);
                state.prizes[idx].chance = Math.max(0, parseFloat(inp.value) || 0);
            });
            const labelInputs = prizesEditorList.querySelectorAll('input[data-field="label"]');
            labelInputs.forEach(inp => {
                const idx = parseInt(inp.dataset.idx, 10);
                if (inp.value.trim()) state.prizes[idx].label = inp.value.trim();
            });
            const iconInputs = prizesEditorList.querySelectorAll('input[data-field="icon"]');
            iconInputs.forEach(inp => {
                const idx = parseInt(inp.dataset.idx, 10);
                if (inp.value.trim()) state.prizes[idx].icon = inp.value.trim();
            });

            const promosArr = promosEditorInput.value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
            state.validPromos = promosArr;

            drawWheel();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentTheme: state.currentTheme,
                        validPromos: state.validPromos,
                        prizes: state.prizes
                    })
                });
                if (res.ok) {
                    alert('✅ Настройки успешно сохранены и синхронизированы!');
                    settingsDrawer.classList.add('hidden');
                    settingsDrawer.classList.remove('flex');
                } else {
                    alert('❌ Ошибка сохранения на сервере.');
                }
            } catch (e) {
                alert('❌ Не удалось подключиться к серверу Amvera.');
            }
        });

        // Запуск при загрузке страницы
        loadSettingsFromServer();
    </script>
</body>
</html>
